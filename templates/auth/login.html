{% extends "base.html" %}
{% block title %}Login — TrekIIT{% endblock %}

{% block content %}

<!-- ── Auth Background ── -->
<div class="auth-bg">
    <div class="auth-bg-overlay"></div>
</div>

<!-- ── Login Card ── -->
<div class="auth-wrapper">
    <div class="auth-card animate-in">
        <div class="form-card-header">
            <h3>Welcome back ⛰️</h3>
            <p>Sign in to your trekking account</p>
        </div>
        <div class="form-card-body">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-4">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com"
                        required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                        required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="padding:.65rem;">Login</button>
            </form>

            <hr style="border-color:var(--border); margin:1.5rem 0;">

            <p class="text-center mb-1" style="font-size:.875rem; color:var(--text-muted);">
                if you not register yet <a href="{{ url_for('auth.register') }}"
                    style="color:var(--green-700);font-weight:600;">Register
                    here</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}
