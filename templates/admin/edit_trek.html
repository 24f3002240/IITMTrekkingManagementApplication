{% extends "base.html" %}
{% block title %}Edit Trek{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Edit Trek</h3>
                <form method="POST" action="{{ url_for('admin.edit_trek', trek_id=trek.id) }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Trek Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ trek.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location"
                            value="{{ trek.location }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="difficulty" class="form-label">Difficulty</label>
                        <select class="form-select" id="difficulty" name="difficulty" required>
                            <option value="Easy" {% if trek.difficulty=='Easy' %}selected{% endif %}>Easy</option>
                            <option value="Moderate" {% if trek.difficulty=='Moderate' %}selected{% endif %}>Moderate
                            </option>
                            <option value="Hard" {% if trek.difficulty=='Hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="duration_days" class="form-label">Duration (days)</label>
                        <input type="number" class="form-control" id="duration_days" name="duration_days"
                            value="{{ trek.duration_days }}" min="1" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date"
                                value="{{ trek.start_date }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date"
                                value="{{ trek.end_date }}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
                <a href="{{ url_for('admin.list_treks') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
