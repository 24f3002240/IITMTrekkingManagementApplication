{% extends "base.html" %}
{% block title %}Create Trek{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="mb-3 d-flex gap-2">
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-primary btn-sm">🗂️ Dashboard</a>
            <a href="{{ url_for('admin.list_treks') }}" class="btn btn-outline-secondary btn-sm">← Back to Treks</a>
        </div>

        <div class="form-card animate-in">
            <div class="form-card-header">
                <h3>Create New Trek 🏔️</h3>
                <p>Fill in the details to add a trek to the platform</p>
            </div>
            <div class="form-card-body">
                <form method="POST" action="{{ url_for('admin.create_trek') }}">

                    <div class="mb-3">
                        <label for="name" class="form-label">Trek Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                            placeholder="e.g. Valley of Flowers" required>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location"
                            placeholder="e.g. Uttarakhand" required>
                    </div>

                    <div class="mb-3">
                        <label for="difficulty" class="form-label">Difficulty</label>
                        <select class="form-select" id="difficulty" name="difficulty" required>
                            <option value="" disabled selected>Choose difficulty…</option>
                            <option value="Easy">🟢 Easy</option>
                            <option value="Moderate">🟡 Moderate</option>
                            <option value="Hard">🔴 Hard</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="duration_days" class="form-label">Duration (days)</label>
                            <input type="number" class="form-control" id="duration_days" name="duration_days"
                                placeholder="e.g. 5" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="available_slots" class="form-label">Available Slots</label>
                            <input type="number" class="form-control" id="available_slots" name="available_slots"
                                placeholder="e.g. 20" min="0" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" style="padding:.65rem;">
                        ✓ Create Trek
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
